name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Lint with the n8n community ruleset
        run: npm run lint
      - name: Structural tests
        run: node --test test/*.test.js
      - name: Icon reached dist
        run: test -f dist/nodes/ApiMaster/apiMaster.svg
