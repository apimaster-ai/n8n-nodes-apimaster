name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # n8n 2.x requires Node >= 22.16; a community node never runs on anything older,
        # and n8n-workflow's isolated-vm dependency does not build on Node 20.
        node: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Lint with the n8n community ruleset
        run: npm run lint
      - name: Structural tests
        run: node --test test/node.test.js
      - name: Icon reached dist
        run: test -f dist/nodes/ApiMaster/apiMaster.svg
